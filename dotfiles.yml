---
- name: Configure dotfiles
  hosts: localhost
  vars:
    path_app_conf: "{{ playbook_dir }}/appconf"
    path_bashrc: "~/.bashrc"
    ssh_config_path: "~/.ssh/config.d"
    path_ssh_conf: "~/.ssh/"
    path_private_local: "~/.config/private_local"
    ncspot_dir: "~/.var/app/io.github.hrkfdn.ncspot/config/ncspot/"
  tasks:
    - name: "Create private_local"
      ansible.builtin.file:
        path: "{{ path_private_local }}"
        state: directory

    - name: "Install bashrc"
      ansible.builtin.file:
        path: "{{ path_bashrc }}"
        src: "{{ playbook_dir }}/bashrc"
        state: link

    - name: "Create config.d"
      ansible.builtin.file:
        path: "{{ ssh_config_path }}"
        state: directory

    - name: "Install ssh config"
      ansible.builtin.file:
        path: "{{ path_ssh_conf }}/config"
        src: "{{ playbook_dir }}/ssh_config"
        state: link
        mode: '600'

    - name: "Gnome Windows Custom Keybinding"
      vars:
        keyb:
          begin-move: "['<Super>w']"
          begin-resize: "['<Super>r']"
          panel-run-dialog: "['<Super>d']"
          mic-mute: "['<Super>AudioMute']"
      loop: "{{ keyb | dict2items }}"
      community.general.dconf:
        key: "/org/gnome/desktop/wm/keybindings/{{ item.key }}"
        value: "{{ item.value }}"

    - name: "Gnome Media Keys Custom Keybinding"
      vars:
        keyb:
          mic-mute: "['<Super>AudioMute']"
      loop: "{{ keyb | dict2items }}"
      community.general.dconf:
        key: "/org/gnome/desktop/settings-daemon/plugins/media-keys/{{ item.key }}"
        value: "{{ item.value }}"
        
    - name: "Configure Applications"
      tags:
        - never
        - application
      block:
        - name: "Install from flatpak"
          community.general.flatpak:
            name:
              - io.github.hrkfdn.ncspot
              - io.gitlab.librewolf-community
              - net.cozic.joplin_desktop
              - io.freetubeapp.FreeTube
              
            state: latest
            remote: flathub
          notify:
            - Ncspot dir
            - Ncspot conf

        - name: Setup ptyxis basic profile
          tags:
            - ptyxis
          vars:
            settings:
              bold-is-bright: false
              label: "'Basic'"
              palette: "'dracula'"
              preserve-directory: "'safe'"
          loop: "{{ settings | dict2items }}"
          community.general.dconf:
            key:  "/org/gnome/Ptyxis/Profiles/ffca20fa64c8cc4cae7d0dbc672d3cc9/{{ item.key }}"
            value: "{{ item.value }}"

        - name: Setup ptyxis presentation profile
          tags:
            - ptyxis
          vars:
            settings:
              bold-is-bright: true
              label: "'Presentation'"
              palette: "'Bluloco Light'"
              preserve-directory: "'safe'"
              scrollback-lines: 100
              use-proxy: false
          loop: "{{ settings | dict2items }}"
          community.general.dconf:
            key:  "/org/gnome/Ptyxis/Profiles/ecea637766b3bd8cb0df50f568430996/{{ item.key }}"
            value: "{{ item.value }}"

        - name: Setup ptyxis presentation profile
          tags:
            - ptyxis
          vars:
            settings:
              default-profile-uuid: "'ffca20fa64c8cc4cae7d0dbc672d3cc9'"
              enable-a11y: false
              interface-style: "'system'"
              new-tab-position: "'last'"
              profile-uuids: "['ffca20fa64c8cc4cae7d0dbc672d3cc9', 'ecea637766b3bd8cb0df50f568430996']"
              restore-session: false
              restore-window-size: true
              use-system-font: true
          loop: "{{ settings | dict2items }}"
          community.general.dconf:
            key:  "/org/gnome/Ptyxis/{{ item.key }}"
            value: "{{ item.value }}"

        
        - name: Setup ptyxis Custom Shortcuts
          tags:
            - ptyxis
          loop:
            - key: "set-title"
              value: "'<Control><Alt>t'"
          community.general.dconf:
            key:  "/org/gnome/Ptyxis/Shortcuts/{{ item.key }}"
            value: "{{ item.value }}"

        - name: "Add charm repository"
          become: true
          ansible.builtin.yum_repository:
            name: charm
            file: charm
            description: "Charm repository"
            baseurl: "https://repo.charm.sh/yum/"
            gpgkey: "https://repo.charm.sh/yum/gpg.key"
          tags:
            - charm

        - name: Enable Copr repo
          become: true
          tags:
            - kcli
          community.general.copr:
            name: karmab/kcli
            state: enabled
        
        - name: "Install kcli"
          become: true
          tags:
            - kcli
          ansible.builtin.dnf:
            name:
              - kcli
            state: present

        - name: "Install base apps"
          become: true
          tags:
            - base_apps
          ansible.builtin.dnf:
            name:
              - bat
              - pandoc
              - uv
            state: present
          
        - name: "Install apps from repo"
          become: true
          ansible.builtin.dnf:
            name:
              - glow
              - toot
              - bat
              - pandoc
              - uv
              - syncthing
              - newsboat
              - kcli
            state: present
          notify:
            - App conf

        - name: Install uv tools
          tags:
            - python
          loop:
            - papis
            - papis-scihub
            - meshtastic
          ansible.builtin.command: >
            uv tool install {{ item }}
            
  handlers:
    - name: Ncspot dir
      ansible.builtin.file:
        path: "{{ ncspot_dir }}"
        state: directory

    - name: Ncspot conf
      ansible.builtin.copy:
        dest: "{{ ncspot_dir }}/config.toml"
        src: "{{ playbook_dir }}/appconf/ncspot/config.toml"
        remote_src: false
        force: true

    - name: App conf
      loop:
        - path: "~/.config/glow"
          src: "{{ path_app_conf}}/glow"
        - path: "~/.newsboat/config"
          src: "{{ pat_app_conf }}/newsboat/config"
      ansible.builtin.file:
        path: "{{ item.path }}"
        src:  "{{ item.src }}"
        state: link
